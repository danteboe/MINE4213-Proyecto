[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanwatch"
version = "0.2.0"
description = "OceanWatch Analytics — lakehouse Databricks para datos AIS de NOAA (Entrega 2)."
requires-python = ">=3.12"
# Las tareas usan PySpark del Databricks Runtime. El DAB declara sus librerías.
dependencies = ["pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
