bundle:
  name: oceanwatch_entrega2

include:
  - resources/jobs/*.yml
  - resources/dashboards/*.yml
  - resources/ml/*.yml

variables:
  cluster_id:
    description: ID de cómputo clásico con Unity Catalog
    lookup:
      cluster: jd.torresa1@uniandes.edu.co's Personal Compute Cluster
  pause_status:
    description: Estado del trigger nativo por llegada de archivo
    default: PAUSED
  pausa_detector:
    description: Estado del detector periódico cuando File arrival no está disponible
    default: UNPAUSED
  cron_detector:
    description: Frecuencia de revisión de metadatos del volumen
    default: "0 0/30 * * * ?"
  ruta_entrada:
    description: Carpeta donde el equipo deposita CSV.ZST, ZIP y CSV AIS
    default: /Volumes/clase10/equipo9/checkpoints/oceanwatch_equipo9/landing/inbox/
  warehouse_id:
    description: SQL warehouse institucional usado por el tablero AI/BI
    default: "4c751147a4c66a5e"

sync:
  exclude:
    - entrega1_oceanwatch.ipynb
    - docs/**
    - evidence/**
    - tests/**
    - tools/**
    - notebooks/fase*.py
    - resources/sql/**
    - resources/dashboards/*.lvdash.json

targets:
  institucional:
    default: true
    mode: production
    workspace:
      host: https://dbc-b38f0852-ecf9.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
