# =============================================================================
# Job de orquestación OceanWatch (Req. 3, Fase 4) — definición DAB.
# =============================================================================
# Pipeline lineal de 4 tareas notebook_task SERVERLESS (sin new_cluster; el curso
# solo tiene cómputo serverless):
#     ingesta -> plata_calidad -> conciliacion (compuerta WAP) -> oro
# El parámetro fecha_proceso (default 2023-06-03) fluye a las 4 tareas vía
# {{job.parameters.fecha_proceso}} -> base_parameters -> dbutils.widgets. La
# identidad de la corrida ({{job.run_id}}/{{job.id}}/{{task.name}}) alimenta la
# auditoría oceanwatch.quality.ejecuciones_job. Los valores (reintentos, cron,
# timezone, emails) replican conf/config.yaml (bloque orquestacion). SIN secretos.
# =============================================================================
resources:
  jobs:
    oceanwatch_pipeline_entrega2:
      name: oceanwatch_pipeline_entrega2
      description: >-
        Pipeline medallion AIS (NOAA): ingesta Auto Loader -> plata/calidad (CTAS)
        -> conciliación (compuerta Write-Audit-Publish) -> oro (CTAS). Cómputo
        serverless. Req. 3 (Orquestación) de la Entrega 2, MINE 4213.

      # Parámetro del Job propagado a cada tarea (backfill = pasar una fecha pasada).
      parameters:
        - name: fecha_proceso
          default: "2023-06-03"

      # Cron de PRODUCCIÓN (06:00 America/Bogota). PAUSED al desplegar: la corrida de
      # demostración SCHEDULED se activa aparte en FEAT-002 y luego se restablece.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Bogota
        pause_status: PAUSED

      # Notificaciones de correo del Job (éxito / fallo / duración excesiva).
      email_notifications:
        on_success:
          - jd.torresa1@uniandes.edu.co
        on_failure:
          - jd.torresa1@uniandes.edu.co
        on_duration_warning_threshold_exceeded:
          - jd.torresa1@uniandes.edu.co
      # Umbral de alerta de duración (para on_duration_warning): 1 hora.
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600

      tasks:
        # ------------------------------------------------------------------ ingesta
        - task_key: ingesta
          notebook_task:
            notebook_path: ${var.workspace_oceanwatch}/notebooks/fase4_tarea_ingesta
            base_parameters:
              fecha_proceso: "{{job.parameters.fecha_proceso}}"
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
          # Red NOAA + arranque serverless = fallos transitorios -> 2 reintentos.
          max_retries: 2
          min_retry_interval_millis: 60000

        # ----------------------------------------------------------- plata_calidad
        - task_key: plata_calidad
          depends_on:
            - task_key: ingesta
          notebook_task:
            notebook_path: ${var.workspace_oceanwatch}/notebooks/fase4_tarea_plata
            base_parameters:
              fecha_proceso: "{{job.parameters.fecha_proceso}}"
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
          # CREATE OR REPLACE determinista -> 1 reintento ante fallo transitorio.
          max_retries: 1
          min_retry_interval_millis: 60000

        # ------------------------------------------------------------ conciliacion
        - task_key: conciliacion
          depends_on:
            - task_key: plata_calidad
          notebook_task:
            notebook_path: ${var.workspace_oceanwatch}/notebooks/fase4_tarea_conciliacion
            base_parameters:
              fecha_proceso: "{{job.parameters.fecha_proceso}}"
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
          # Compuerta WAP: invariante que no cuadra NO es transitorio -> 0 reintentos.
          max_retries: 0

        # ------------------------------------------------------------------- oro
        - task_key: oro
          depends_on:
            - task_key: conciliacion
          notebook_task:
            notebook_path: ${var.workspace_oceanwatch}/notebooks/fase4_tarea_oro
            base_parameters:
              fecha_proceso: "{{job.parameters.fecha_proceso}}"
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
          max_retries: 1
          min_retry_interval_millis: 60000

        # ------------------------------------------------------------------------
        # NODOS FUTUROS (documentados, NO implementados en esta entrega):
        #   - ml:                depends_on: [oro]   (Fase 6, Req. pronóstico/anomalías)
        #   - refresh_dashboard: depends_on: [oro]   (Fase 7, dashboard de Databricks)
        # Colgarán de `oro` como nuevas tasks notebook_task/dashboard_task serverless.
        # ------------------------------------------------------------------------
