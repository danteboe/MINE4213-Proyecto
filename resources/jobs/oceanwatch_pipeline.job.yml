resources:
  jobs:
    oceanwatch_pipeline_entrega2:
      name: OceanWatch | Entrega 2 | Equipo 9
      description: Procesa archivos AIS al llegar al volumen y admite backfill manual de NOAA.
      permissions:
        - group_name: mine-group9
          level: CAN_MANAGE_RUN
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: fecha_proceso
          default: ""
        - name: fecha_inicio
          default: ""
        - name: entrenar
          default: "false"
      trigger:
        pause_status: ${var.pause_status}
        file_arrival:
          url: ${var.ruta_entrada}
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      email_notifications:
        on_failure:
          - jd.torresa1@uniandes.edu.co
        on_duration_warning_threshold_exceeded:
          - jd.torresa1@uniandes.edu.co
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 5400
      tasks:
        - task_key: preparar
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../../notebooks/oceanwatch_cluster.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
              trigger: "{{job.trigger.type}}"
              ruta_entrada: ${var.ruta_entrada}
          timeout_seconds: 5400
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: ingesta
          depends_on:
            - task_key: preparar
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../../notebooks/oceanwatch_cluster.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
              trigger: "{{job.trigger.type}}"
              ruta_entrada: ${var.ruta_entrada}
          timeout_seconds: 5400
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: plata_calidad
          depends_on:
            - task_key: ingesta
          existing_cluster_id: ${var.cluster_id}
          libraries:
            - pypi:
                package: global-land-mask==1.0.0
            - pypi:
                package: shapely==2.1.2
          notebook_task:
            notebook_path: ../../notebooks/oceanwatch_cluster.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
              trigger: "{{job.trigger.type}}"
          timeout_seconds: 5400
          max_retries: 1
          min_retry_interval_millis: 60000
        - task_key: conciliacion
          depends_on:
            - task_key: plata_calidad
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../../notebooks/oceanwatch_cluster.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
              trigger: "{{job.trigger.type}}"
          timeout_seconds: 900
          max_retries: 0
        - task_key: oro
          depends_on:
            - task_key: conciliacion
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../../notebooks/oceanwatch_cluster.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
              trigger: "{{job.trigger.type}}"
          timeout_seconds: 5400
          max_retries: 1
          min_retry_interval_millis: 60000
        - task_key: ml_anomalias
          depends_on:
            - task_key: oro
          existing_cluster_id: ${var.cluster_id}
          libraries:
            - pypi:
                package: mlflow==3.11.0
            - pypi:
                package: scikit-learn==1.8.0
          notebook_task:
            notebook_path: ../../notebooks/oceanwatch_cluster.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_id: "{{job.id}}"
              task_key: "{{task.name}}"
              trigger: "{{job.trigger.type}}"
          timeout_seconds: 5400
          max_retries: 1
          min_retry_interval_millis: 60000
