# OceanWatch Analytics — configuración centralizada (SIN secretos)
# La key de Databricks vive FUERA del repo (databricks.key) y NO se referencia aquí.
# Ningún token, contraseña ni ruta personal debe añadirse a este archivo.
proyecto:
  nombre: "OceanWatch Analytics"
  entrega: 2

databricks:
  host: "https://dbc-a568bc49-bdae.cloud.databricks.com/"   # solo referencia, sin token
  region: "us-east-2"
  metastore: "metastore_aws_us_east_2"
  compute: "serverless"

catalogo:
  nombre: "oceanwatch"
  esquemas:
    bronze: "bronze"
    silver: "silver"
    gold: "gold"
    quarantine: "quarantine"
    quality: "quality"
    ml: "ml"
    entrega1: "entrega1"   # preservado, NO modificar

volumenes:
  landing: "landing"         # oceanwatch.bronze.landing (zips/csv descomprimidos)
  checkpoints: "checkpoints" # oceanwatch.bronze.checkpoints (Structured Streaming)

rutas:
  zip_subdir: "zips"
  csv_subdir: "csv"
  wpi_shapefile: "world_port_index/WPI.shp"   # relativo a la raíz del workspace local

fuente_noaa:
  base_url: "https://coast.noaa.gov/htdata/CMSP/AISDataHandler/2023"
  patron_archivo: "AIS_{fecha}.zip"            # fecha = YYYY_MM_DD
  acceso: "2026-11-05"

corpus:
  fecha_inicio_default: "2023-06-01"
  # Corpus de 3 días para la ingesta verificada de Fase 2 (2023-06-01/02/03).
  # El diseño admite rangos mayores: basta ampliar esta fecha (o pasar fechas
  # explícitas a la orquestación) para ingerir más días del feed AIS.
  fecha_fin_default: "2023-06-03"
  resiliencia: "diseñado para admitir archivos y fechas nuevas del feed AIS"

ingesta:
  tabla_bronze: "ais_raw"                 # oceanwatch.bronze.ais_raw (append-only, ADR-006)
  tabla_metricas:
    esquema: "quality"                    # oceanwatch.quality.ingesta_metricas
    objeto: "ingesta_metricas"
  watermark_dedup: "24 hours"             # ventana de watermark para dedup bronze->silver (ADR-006)
  clave_dedup: ["MMSI", "BaseDateTime"]   # clave natural de deduplicación
  subruta_csv: "csv"                      # landing/csv/date=YYYY-MM-DD/
  subruta_zips: "zips"                    # landing/zips/
  checkpoint: "bronze/ais_raw"            # bajo el volumen checkpoints
  rescued_column: "_rescued_data"         # columna de datos rescatados (evolución de esquema)
  txn_app_id: "oceanwatch_bronze_ais_raw" # idempotencia exactly-once en foreachBatch (ADR-004)

esquema_ais:   # 17 campos, esquema explícito (continuidad Entrega 1)
  - { nombre: "MMSI", tipo: "long" }
  - { nombre: "BaseDateTime", tipo: "timestamp" }
  - { nombre: "LAT", tipo: "double" }
  - { nombre: "LON", tipo: "double" }
  - { nombre: "SOG", tipo: "double" }
  - { nombre: "COG", tipo: "double" }
  - { nombre: "Heading", tipo: "double" }
  - { nombre: "VesselName", tipo: "string" }
  - { nombre: "IMO", tipo: "string" }
  - { nombre: "CallSign", tipo: "string" }
  - { nombre: "VesselType", tipo: "int" }
  - { nombre: "Status", tipo: "int" }   # código AIS entero (muestra real: verificacion_esquema_real.md)
  - { nombre: "Length", tipo: "double" }
  - { nombre: "Width", tipo: "double" }
  - { nombre: "Draft", tipo: "double" }
  - { nombre: "Cargo", tipo: "int" }
  - { nombre: "TransceiverClass", tipo: "string" }

gold:
  grilla_espacial: "redondeo_latlon"   # decisión Fase 1: NO H3 (ver ADR-001)
  decimales_grilla: 2

# Capa PLATA (Req. 2, FEAT-003): nombres de las tablas resultado y parámetros de
# materialización. SIN secretos. Reutiliza ingesta.watermark_dedup y clave_dedup
# para la deduplicación bronce->plata (ADR-006); NO se redefinen aquí.
silver:
  tabla_clean: "ais_clean"             # oceanwatch.silver.ais_clean (pasa TODAS las compuertas de descarte)
  # Columnas de banderas que marcan los atributos nulificados (acción nulificar_atributo).
  banderas:
    sog: "sog_no_disponible"           # SOG>=102.3 (centinela) -> SOG=null + bandera
    heading: "heading_desconocido"     # Heading=511 (centinela) -> Heading=null + bandera
    cog: "cog_desconocido"             # COG=360 (centinela) -> COG=null + bandera
    length: "length_no_fisica"         # Length<=0 -> Length=null + bandera
    width: "width_no_fisica"           # Width<=0 -> Width=null + bandera
    draft: "draft_no_fisica"           # Draft<=0 -> Draft=null + bandera
    imo: "imo_invalido"                # IMO con patrón inválido -> IMO=null + bandera (vacío es VÁLIDO)
    en_agua: "en_agua"                 # bandera tierra/agua (ADR-010, nulificar_atributo, NO descarta)

quarantine:
  tabla_rejected: "ais_rejected"       # oceanwatch.quarantine.ais_rejected (registro original + causas + fechas)
  # Patrón Dead-letter/Quarantine (ADR-011): registro original COMPLETO + causas
  # (array<string> con los NOMBRES de las reglas de descarte violadas) + _batch_date
  # + _fecha_cuarentena. Una fila con varias causas cuenta UNA sola vez.
  columna_causas: "causas"
  columna_fecha_cuarentena: "_fecha_cuarentena"

quality_plata:
  tabla_metricas_calidad: "metricas_calidad"   # oceanwatch.quality.metricas_calidad (por lote/día y por regla)
  # Umbral de alerta de % de rechazo por regla: si una regla de descarte rechaza
  # una fracción >= a este umbral (sobre los evaluados del lote/día), la columna
  # 'alerta' de metricas_calidad se marca True. 0.05 = 5%. Parametrizable.
  umbral_alerta_pct_rechazo: 0.05

# Catálogo de reglas de calidad de la capa plata (Req. 2, ADR-009).
# Cada regla lleva: umbral(es) parametrizados, un nombre estable, su versión ('v1')
# y la acción cuando se viola ('descartar_fila' => a cuarentena; 'nulificar_atributo'
# => la fila pasa, el atributo va a null + bandera). Los umbrales NO son "a ojo":
# están justificados por el diagnóstico real de 25.897.493 filas
# (evidence/req02-capas-calidad/diagnostico_calidad_bronce.md). SIN secretos.
calidad:
  # Rango geográfico físico de coordenadas y valores centinela "no disponible".
  coordenadas:
    lat_min: -90.0
    lat_max: 90.0
    lon_min: -180.0
    lon_max: 180.0
    lat_centinela: 91.0        # LAT=91 => "no disponible" (0 casos en el corpus, regla por robustez)
    lon_centinela: 181.0       # LON=181 => "no disponible"
  # Velocidad sobre el fondo (knots). Centinela AIS 102.3 = "no disponible".
  sog:
    centinela: 102.3           # SOG>=102.3 => "no disponible"; 65.510 casos en el corpus
    # Máximo físico plausible: 80 kn. Muy por encima de P99.9=32.5 kn (deja pasar
    # buques rápidos reales entre 32.5 y 80) y muy por debajo del centinela 102.3,
    # que es el corte inequívoco. Entre 80 y 102.3 no hay señales reales esperadas.
    max_fisico: 80.0
  # Rumbo de proa (Heading). Centinela AIS 511 = "no disponible".
  heading:
    centinela: 511.0           # 14.367.009 casos (~55.5%) en el corpus
    min: 0.0
    max: 359.0
  # Rumbo sobre el fondo (COG). Centinela AIS 360 = "no disponible".
  cog:
    centinela: 360.0           # 4.376.798 casos (~16.9%) en el corpus
    min: 0.0
    max: 359.0
  # Identificadores de buque.
  mmsi:
    digitos: 9                 # MMSI válido = exactamente 9 dígitos; 21.960 no cumplen (~0.085%)
    mid_min: 201               # MID (3 primeros dígitos) en el rango ITU de países marítimos
    mid_max: 775               # [201,775] según la asignación ITU de Maritime Identification Digits
  imo:
    digitos: 7                 # IMO = 7 dígitos con dígito verificador; vacío/None es VÁLIDO
  # Dimensiones estáticas del buque (metros). Valor <= 0 es no físico.
  dimensiones:
    min_exclusivo: 0.0         # Length/Width/Draft deben ser > 0
  # Máscara tierra/agua (ADR-010, FEAT-002). Una posición AIS tierra adentro es casi
  # seguro un error de posición. Método principal: global-land-mask (máscara ráster
  # global ~1/120°) instalada vía %pip pinneado en el notebook serverless (NO viene
  # preinstalada, ver evidence/.../disponibilidad_librerias_serverless.md). Baseline
  # sin dependencias (bbox) como salvaguarda. Acción decidida en ADR-010.
  coordenada_en_agua:
    metodo: "global_land_mask"       # método principal (ADR-010)
    libreria: "global-land-mask"     # paquete PyPI a instalar en serverless
    version: "1.0.0"                 # versión pinneada por reproducibilidad
    # Cajas delimitadoras de agua para el baseline SIN dependencias (salvaguarda).
    # [lat_min, lat_max, lon_min, lon_max] en grados decimales.
    bbox_agua:
      - [-80.0, 80.0, -180.0, 180.0]
  # Nombre estable, versión y acción por regla (consumido por FEAT-003).
  reglas:
    coordenadas_en_rango:
      nombre: "coordenadas_en_rango"
      version: "v1"
      accion: "descartar_fila"
    coordenada_no_centinela:
      nombre: "coordenada_no_centinela"
      version: "v1"
      accion: "descartar_fila"
    mmsi_bien_formado:
      nombre: "mmsi_bien_formado"
      version: "v1"
      accion: "descartar_fila"
    mmsi_mid_valido:
      nombre: "mmsi_mid_valido"
      version: "v1"
      accion: "descartar_fila"
    timestamp_valido_no_futuro:
      nombre: "timestamp_valido_no_futuro"
      version: "v1"
      accion: "descartar_fila"
    sog_plausible:
      nombre: "sog_plausible"
      version: "v1"
      accion: "nulificar_atributo"
    heading_valido:
      nombre: "heading_valido"
      version: "v1"
      accion: "nulificar_atributo"
    cog_valido:
      nombre: "cog_valido"
      version: "v1"
      accion: "nulificar_atributo"
    dimension_fisica:
      nombre: "dimension_fisica"
      version: "v1"
      accion: "nulificar_atributo"
    imo_valido:
      nombre: "imo_valido"
      version: "v1"
      accion: "nulificar_atributo"
    coordenada_en_agua:              # ADR-010 (FEAT-002): NULIFICAR_ATRIBUTO (bandera en_agua).
      # La medición real (60.000 filas, run 614704376036187) dio 72.28% de la muestra AIS
      # clasificada como "tierra" porque la máscara ráster ~1/120° marca como tierra los
      # canales de navegación y puertos interiores (p.ej. Houston Ship Channel 29.8/-95.1,
      # Nueva Orleans/delta del Mississippi) que son tráfico AIS VÁLIDO. Descartar esas
      # filas destruiría la mayoría del corpus; por eso la acción es NULIFICAR_ATRIBUTO:
      # la fila pasa y se marca la bandera en_agua para que el consumidor decida.
      nombre: "coordenada_en_agua"
      version: "v1"
      accion: "nulificar_atributo"
