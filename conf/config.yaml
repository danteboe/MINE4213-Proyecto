# OceanWatch Analytics — configuración centralizada (SIN secretos)
# La key de Databricks vive FUERA del repo (databricks.key) y NO se referencia aquí.
# Ningún token, contraseña ni ruta personal debe añadirse a este archivo.
proyecto:
  nombre: "OceanWatch Analytics"
  entrega: 2

databricks:
  host: "https://dbc-a568bc49-bdae.cloud.databricks.com/"   # solo referencia, sin token
  region: "us-east-2"
  metastore: "metastore_aws_us_east_2"
  compute: "serverless"

catalogo:
  nombre: "oceanwatch"
  esquemas:
    bronze: "bronze"
    silver: "silver"
    gold: "gold"
    quarantine: "quarantine"
    quality: "quality"
    ml: "ml"
    entrega1: "entrega1"   # preservado, NO modificar

volumenes:
  landing: "landing"         # oceanwatch.bronze.landing (zips/csv descomprimidos)
  checkpoints: "checkpoints" # oceanwatch.bronze.checkpoints (Structured Streaming)

rutas:
  zip_subdir: "zips"
  csv_subdir: "csv"
  wpi_shapefile: "world_port_index/WPI.shp"   # relativo a la raíz del workspace local

fuente_noaa:
  base_url: "https://coast.noaa.gov/htdata/CMSP/AISDataHandler/2023"
  patron_archivo: "AIS_{fecha}.zip"            # fecha = YYYY_MM_DD
  acceso: "2026-11-05"

corpus:
  fecha_inicio_default: "2023-06-01"
  # Corpus de 3 días para la ingesta verificada de Fase 2 (2023-06-01/02/03).
  # El diseño admite rangos mayores: basta ampliar esta fecha (o pasar fechas
  # explícitas a la orquestación) para ingerir más días del feed AIS.
  fecha_fin_default: "2023-06-03"
  resiliencia: "diseñado para admitir archivos y fechas nuevas del feed AIS"

ingesta:
  tabla_bronze: "ais_raw"                 # oceanwatch.bronze.ais_raw (append-only, ADR-006)
  tabla_metricas:
    esquema: "quality"                    # oceanwatch.quality.ingesta_metricas
    objeto: "ingesta_metricas"
  watermark_dedup: "24 hours"             # ventana de watermark para dedup bronze->silver (ADR-006)
  clave_dedup: ["MMSI", "BaseDateTime"]   # clave natural de deduplicación
  subruta_csv: "csv"                      # landing/csv/date=YYYY-MM-DD/
  subruta_zips: "zips"                    # landing/zips/
  checkpoint: "bronze/ais_raw"            # bajo el volumen checkpoints
  rescued_column: "_rescued_data"         # columna de datos rescatados (evolución de esquema)
  txn_app_id: "oceanwatch_bronze_ais_raw" # idempotencia exactly-once en foreachBatch (ADR-004)

esquema_ais:   # 17 campos, esquema explícito (continuidad Entrega 1)
  - { nombre: "MMSI", tipo: "long" }
  - { nombre: "BaseDateTime", tipo: "timestamp" }
  - { nombre: "LAT", tipo: "double" }
  - { nombre: "LON", tipo: "double" }
  - { nombre: "SOG", tipo: "double" }
  - { nombre: "COG", tipo: "double" }
  - { nombre: "Heading", tipo: "double" }
  - { nombre: "VesselName", tipo: "string" }
  - { nombre: "IMO", tipo: "string" }
  - { nombre: "CallSign", tipo: "string" }
  - { nombre: "VesselType", tipo: "int" }
  - { nombre: "Status", tipo: "int" }   # código AIS entero (muestra real: verificacion_esquema_real.md)
  - { nombre: "Length", tipo: "double" }
  - { nombre: "Width", tipo: "double" }
  - { nombre: "Draft", tipo: "double" }
  - { nombre: "Cargo", tipo: "int" }
  - { nombre: "TransceiverClass", tipo: "string" }

# Orquestación (Req. 3, Fase 4). Define el Job de Databricks que orquesta el
# pipeline ya construido y verificado en fases 1-3. SIN secretos (host/token viven
# FUERA del repo, en databricks.key). Cada valor se justifica abajo en español.
orquestacion:
  # Nombre del Job (entregable A); se usa como job name en el DAB/JSON.
  nombre_job: "oceanwatch_pipeline_entrega2"
  # Parámetro que fluye a las 4 tareas vía {{job.parameters.fecha_proceso}}.
  # Default = 2023-06-03 (último día del corpus verificado de Fase 2). Un backfill
  # usa una fecha pasada (p. ej. 2023-06-01). Formato YYYY-MM-DD (ingest.paths._validar_fecha).
  fecha_proceso_default: "2023-06-03"
  # Tabla de auditoría de ejecuciones del Job (una fila por corrida+tarea). NO se
  # modifica ninguna tabla existente; es una tabla NUEVA en el esquema quality.
  tabla_auditoria:
    esquema: "quality"                 # oceanwatch.quality.ejecuciones_job
    objeto: "ejecuciones_job"
  # Cron de PRODUCCIÓN (Quartz, 6 campos): 06:00 America/Bogota a diario. 06:00
  # Bogota = 11:00 UTC; margen cómodo tras la publicación diaria del feed AIS de NOAA.
  # Se crea PAUSED (pause_status) para no disparar corridas no deseadas al desplegar.
  cron_produccion: "0 0 6 * * ?"
  # Cron de DEMOSTRACIÓN (alta frecuencia): cada 5 minutos. Se activa ~15 min en
  # FEAT-002 para capturar 2-3 corridas SCHEDULED reales y luego se restablece producción.
  cron_demostracion: "0 */5 * * * ?"
  # Serverless usa UTC por defecto (ADR-004); el Quartz cron del Job respeta timezone_id.
  timezone: "America/Bogota"
  # Reintentos por tarea. Justificación: ingesta toca red NOAA y arranque serverless
  # (fallos transitorios) -> 2 reintentos; plata/oro recomputan determinísticamente
  # (CREATE OR REPLACE) -> 1 reintento ante un fallo transitorio de arranque;
  # conciliación es la COMPUERTA Write-Audit-Publish: que el invariante no cuadre NO
  # es transitorio, reintentar a ciegas no lo arregla -> 0 reintentos (falla el Job).
  reintentos:
    ingesta: { max_retries: 2, min_retry_interval_millis: 60000 }
    plata_calidad: { max_retries: 1, min_retry_interval_millis: 60000 }
    oro: { max_retries: 1, min_retry_interval_millis: 60000 }
    conciliacion: { max_retries: 0, min_retry_interval_millis: 0 }
  # Notificaciones de correo del Job (on_success/on_failure/on_duration_warning).
  emails_notificacion:
    - "jd.torresa1@uniandes.edu.co"

gold:
  grilla_espacial: "redondeo_latlon"   # decisión Fase 1: NO H3 (ver ADR-001)
  decimales_grilla: 2
  # Capa ORO (Req. 2, FEAT-004): nombres de las tablas resultado y de la tabla de
  # referencia World Port Index. El oro se alimenta SOLO de oceanwatch.silver.ais_clean
  # (el oro NO limpia). SIN secretos.
  tabla_trayectorias: "trayectorias_diarias"      # oceanwatch.gold.trayectorias_diarias (1 fila por MMSI+día)
  tabla_presencia_puertos: "presencia_puertos"    # oceanwatch.gold.presencia_puertos (1 fila por MMSI+puerto+día)
  tabla_matriz_trafico: "matriz_trafico"          # oceanwatch.gold.matriz_trafico (1 fila por celda+hora)
  tabla_wpi: "world_port_index"                   # oceanwatch.gold.world_port_index (tabla de referencia, ~3.669 puertos)
  # Regla geoespacial de 'en puerto' (ADR-012). Una posición AIS se considera
  # 'en puerto' si cae en la MISMA celda de grilla (lat/lon a decimales_grilla=2)
  # que algún puerto del WPI, es decir, dentro de un radio efectivo < ~1.6 km del
  # puerto (media celda ~0.55 km en cada eje a 2 decimales). Join por celda =
  # consistente con ADR-001 (grilla por redondeo, NO H3) y barato a 25.9M filas.
  presencia_puertos_param:
    decimales_celda_puerto: 2            # redondeo lat/lon de puerto y de posición (ratifica ADR-001)
    permanencia_minima_posiciones: 3     # nº mínimo de posiciones AIS del buque en la celda-puerto ese día
    # Justificación del umbral de permanencia (ADR-012): a P50 del intervalo de
    # reporte AIS, 3 posiciones en una misma celda-puerto evitan contar un simple
    # tránsito (1-2 pings) como 'presencia en puerto'. Parametrizable.

# Capa PLATA (Req. 2, FEAT-003): nombres de las tablas resultado y parámetros de
# materialización. SIN secretos. Reutiliza ingesta.watermark_dedup y clave_dedup
# para la deduplicación bronce->plata (ADR-006); NO se redefinen aquí.
silver:
  tabla_clean: "ais_clean"             # oceanwatch.silver.ais_clean (pasa TODAS las compuertas de descarte)
  # Tabla de referencia celda->en_agua (ADR-010): una fila por celda de grilla distinta
  # (round(LAT,2),round(LON,2)) con su bandera en_agua. Se puebla clasificando las celdas
  # DISTINTAS con global-land-mask FUERA de Spark (sin pandas_udf) y enriquece la plata
  # por MERGE de celda. Se conserva como referencia reutilizable.
  tabla_celda_en_agua: "celda_en_agua" # oceanwatch.silver.celda_en_agua
  # Columnas de banderas que marcan los atributos nulificados (acción nulificar_atributo).
  banderas:
    sog: "sog_no_disponible"           # SOG>=102.3 (centinela) -> SOG=null + bandera
    heading: "heading_desconocido"     # Heading=511 (centinela) -> Heading=null + bandera
    cog: "cog_desconocido"             # COG=360 (centinela) -> COG=null + bandera
    length: "length_no_fisica"         # Length<=0 -> Length=null + bandera
    width: "width_no_fisica"           # Width<=0 -> Width=null + bandera
    draft: "draft_no_fisica"           # Draft<=0 -> Draft=null + bandera
    imo: "imo_invalido"                # IMO con patrón inválido -> IMO=null + bandera (vacío es VÁLIDO)
    en_agua: "en_agua"                 # bandera tierra/agua (ADR-010, nulificar_atributo, NO descarta)

# Machine Learning (Req. 6, Fase 6). Detección de anomalías de velocidad SOG
# RELATIVA al tipo de buque (ADR-005). SIN secretos. Cada valor se justifica abajo.
ml:
  # Esquema de UC donde vive el MODELO registrado (oceanwatch.ml.<modelo>). La TABLA
  # de salida, en cambio, se expone en 'gold' para que el dashboard (Req.4) la consuma.
  esquema: "ml"
  # Tabla de anomalías en esquema GOLD (D8): 1 fila por posición anómala, apta para el
  # visual 'anomalías del día'. Se expone en gold (no ml) para consumo directo del dashboard.
  tabla_anomalias:
    esquema: "gold"                    # oceanwatch.gold.anomalias_velocidad
    objeto: "anomalias_velocidad"
  # Modelo en Unity Catalog, nombre three-part catalogo.esquema.objeto (MLflow 3 / UC).
  modelo_uc: "oceanwatch.ml.detector_anomalias_velocidad"
  # Alias del campeón (UC usa ALIAS, no stages deprecados). La inferencia carga @champion.
  alias_campeon: "champion"
  # Experimento MLflow bajo el workspace del usuario (ruta de workspace, no secreto).
  experimento: "/Users/jd.torresa1@uniandes.edu.co/oceanwatch_anomalias_sog"
  # Semilla única para muestreo y modelo (D7, reproducibilidad).
  semilla: 42
  # Partición TEMPORAL (D3, antifuga): se entrena con 2023-06-01/02 y se infiere sobre
  # 2023-06-03 (no aleatoria: evita filtrar futuro->pasado del mismo buque; es el
  # escenario real de inferencia batch del día siguiente).
  train_batch_dates: ["2023-06-01", "2023-06-02"]
  test_batch_date: "2023-06-03"
  # Muestra reproducible traída al driver con toPandas() para entrenar en serverless
  # (D4): ~200k filas evitan el INTERNAL_ERROR de Spark Connect al escribir volúmenes
  # grandes y bastan para un modelo simple; la muestra usa la semilla 42.
  muestra_entrenamiento_filas: 200000
  # Umbral de la línea base |z_sog|>3 (D2): ~3 desviaciones estándar del tipo.
  umbral_zscore_base: 3.0
  # IsolationForest de scikit-learn (D2). contamination 0.01 = se espera ~1% de
  # anomalías; random_state 42 reproducible; 100 árboles = default robusto y barato.
  isolation_forest:
    n_estimators: 100
    contamination: 0.01
    random_state: 42
  # Orden FIJO del vector de características = CONTRATO del modelo (D1). NO reordenar:
  # debe coincidir exactamente entre entrenamiento e inferencia.
  features_orden: ["z_sog", "delta_sog", "hora_sin", "hora_cos"]
  # Versiones de las librerías ML que se instalan con %pip PINNEADO dentro del notebook
  # serverless (reproducibilidad, D7). NO son dependencias locales de pyproject: solo
  # existen en el runtime de Databricks. Las versiones EXACTAS se fijan tras la 1a
  # corrida real del notebook de entrenamiento (FEAT-002), que resuelve lo disponible
  # en el runtime; hasta entonces estos valores son PENDIENTE DE EJECUCIÓN (placeholder).
  pip_pins:
    mlflow: "PENDIENTE_FEAT002"        # versión exacta tras la 1a corrida real
    scikit-learn: "PENDIENTE_FEAT002"
    numpy: "PENDIENTE_FEAT002"
    pandas: "PENDIENTE_FEAT002"

quarantine:
  tabla_rejected: "ais_rejected"       # oceanwatch.quarantine.ais_rejected (registro original + causas + fechas)
  # Patrón Dead-letter/Quarantine (ADR-011): registro original COMPLETO + causas
  # (array<string> con los NOMBRES de las reglas de descarte violadas) + _batch_date
  # + _fecha_cuarentena. Una fila con varias causas cuenta UNA sola vez.
  columna_causas: "causas"
  columna_fecha_cuarentena: "_fecha_cuarentena"

quality_plata:
  tabla_metricas_calidad: "metricas_calidad"   # oceanwatch.quality.metricas_calidad (por lote/día y por regla)
  # Umbral de alerta de % de rechazo por regla: si una regla de descarte rechaza
  # una fracción >= a este umbral (sobre los evaluados del lote/día), la columna
  # 'alerta' de metricas_calidad se marca True. 0.05 = 5%. Parametrizable.
  umbral_alerta_pct_rechazo: 0.05

# Catálogo de reglas de calidad de la capa plata (Req. 2, ADR-009).
# Cada regla lleva: umbral(es) parametrizados, un nombre estable, su versión ('v1')
# y la acción cuando se viola ('descartar_fila' => a cuarentena; 'nulificar_atributo'
# => la fila pasa, el atributo va a null + bandera). Los umbrales NO son "a ojo":
# están justificados por el diagnóstico real de 25.897.493 filas
# (evidence/req02-capas-calidad/diagnostico_calidad_bronce.md). SIN secretos.
calidad:
  # Rango geográfico físico de coordenadas y valores centinela "no disponible".
  coordenadas:
    lat_min: -90.0
    lat_max: 90.0
    lon_min: -180.0
    lon_max: 180.0
    lat_centinela: 91.0        # LAT=91 => "no disponible" (0 casos en el corpus, regla por robustez)
    lon_centinela: 181.0       # LON=181 => "no disponible"
  # Velocidad sobre el fondo (knots). Centinela AIS 102.3 = "no disponible".
  sog:
    centinela: 102.3           # SOG>=102.3 => "no disponible"; 65.510 casos en el corpus
    # Máximo físico plausible: 80 kn. Muy por encima de P99.9=32.5 kn (deja pasar
    # buques rápidos reales entre 32.5 y 80) y muy por debajo del centinela 102.3,
    # que es el corte inequívoco. Entre 80 y 102.3 no hay señales reales esperadas.
    max_fisico: 80.0
  # Rumbo de proa (Heading). Centinela AIS 511 = "no disponible".
  heading:
    centinela: 511.0           # 14.367.009 casos (~55.5%) en el corpus
    min: 0.0
    max: 359.0
  # Rumbo sobre el fondo (COG). Centinela AIS 360 = "no disponible".
  cog:
    centinela: 360.0           # 4.376.798 casos (~16.9%) en el corpus
    min: 0.0
    max: 359.0
  # Identificadores de buque.
  mmsi:
    digitos: 9                 # MMSI válido = exactamente 9 dígitos; 21.960 no cumplen (~0.085%)
    mid_min: 201               # MID (3 primeros dígitos) en el rango ITU de países marítimos
    mid_max: 775               # [201,775] según la asignación ITU de Maritime Identification Digits
  imo:
    digitos: 7                 # IMO = 7 dígitos con dígito verificador; vacío/None es VÁLIDO
  # Dimensiones estáticas del buque (metros). Valor <= 0 es no físico.
  dimensiones:
    min_exclusivo: 0.0         # Length/Width/Draft deben ser > 0
  # Máscara tierra/agua (ADR-010, FEAT-002). Una posición AIS tierra adentro es casi
  # seguro un error de posición. Método principal: global-land-mask (máscara ráster
  # global ~1/120°) instalada vía %pip pinneado en el notebook serverless (NO viene
  # preinstalada, ver evidence/.../disponibilidad_librerias_serverless.md). Baseline
  # sin dependencias (bbox) como salvaguarda. Acción decidida en ADR-010.
  coordenada_en_agua:
    metodo: "global_land_mask"       # método principal (ADR-010)
    libreria: "global-land-mask"     # paquete PyPI a instalar en serverless
    version: "1.0.0"                 # versión pinneada por reproducibilidad
    # Cajas delimitadoras de agua para el baseline SIN dependencias (salvaguarda).
    # [lat_min, lat_max, lon_min, lon_max] en grados decimales.
    bbox_agua:
      - [-80.0, 80.0, -180.0, 180.0]
  # Nombre estable, versión y acción por regla (consumido por FEAT-003).
  reglas:
    coordenadas_en_rango:
      nombre: "coordenadas_en_rango"
      version: "v1"
      accion: "descartar_fila"
    coordenada_no_centinela:
      nombre: "coordenada_no_centinela"
      version: "v1"
      accion: "descartar_fila"
    mmsi_bien_formado:
      nombre: "mmsi_bien_formado"
      version: "v1"
      accion: "descartar_fila"
    mmsi_mid_valido:
      nombre: "mmsi_mid_valido"
      version: "v1"
      accion: "descartar_fila"
    timestamp_valido_no_futuro:
      nombre: "timestamp_valido_no_futuro"
      version: "v1"
      accion: "descartar_fila"
    sog_plausible:
      nombre: "sog_plausible"
      version: "v1"
      accion: "nulificar_atributo"
    heading_valido:
      nombre: "heading_valido"
      version: "v1"
      accion: "nulificar_atributo"
    cog_valido:
      nombre: "cog_valido"
      version: "v1"
      accion: "nulificar_atributo"
    dimension_fisica:
      nombre: "dimension_fisica"
      version: "v1"
      accion: "nulificar_atributo"
    imo_valido:
      nombre: "imo_valido"
      version: "v1"
      accion: "nulificar_atributo"
    coordenada_en_agua:              # ADR-010 (FEAT-002): NULIFICAR_ATRIBUTO (bandera en_agua).
      # La medición real (60.000 filas, run 614704376036187) dio 72.28% de la muestra AIS
      # clasificada como "tierra" porque la máscara ráster ~1/120° marca como tierra los
      # canales de navegación y puertos interiores (p.ej. Houston Ship Channel 29.8/-95.1,
      # Nueva Orleans/delta del Mississippi) que son tráfico AIS VÁLIDO. Descartar esas
      # filas destruiría la mayoría del corpus; por eso la acción es NULIFICAR_ATRIBUTO:
      # la fila pasa y se marca la bandera en_agua para que el consumidor decida.
      nombre: "coordenada_en_agua"
      version: "v1"
      accion: "nulificar_atributo"
